server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing: fall back to index.html for any unmatched path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the api container so the SPA can call a same-origin /api path
    # in the Docker Compose environment (see environment.prod.ts apiUrl: '/api/v1').
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
